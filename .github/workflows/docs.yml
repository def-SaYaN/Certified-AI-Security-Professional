name: Course site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Check rendered links and code blocks
        run: python scripts/check_site.py

      # Only used when publishing to GitHub Pages is switched on (see deploy job).
      - name: Package for GitHub Pages
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      # A copy that opens straight from disk: download, unzip, open index.html.
      - name: Build offline copy
        run: OFFLINE=true mkdocs build --strict --site-dir offline-site

      - name: Upload offline copy
        uses: actions/upload-artifact@v4
        with:
          name: course-site-offline
          path: offline-site/
          retention-days: 90

  # Off by default. GitHub Pages sites are PUBLIC on Free, Pro and Team plans even when the
  # repository is private. To publish, enable Pages (Settings -> Pages -> Source: GitHub Actions)
  # and set the repository variable DEPLOY_PAGES to "true".
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
